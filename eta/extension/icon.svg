<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#0891b2"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="url(#bg)"/>
  <!-- Shield shape -->
  <path d="M128 40 L200 70 L200 150 C200 190 165 220 128 235 C91 220 56 190 56 150 L56 70 Z"
        fill="url(#shield)" stroke="#22d3ee" stroke-width="4"/>
  <!-- Inner shield highlight -->
  <path d="M128 55 L185 80 L185 145 C185 175 158 200 128 212 C98 200 71 175 71 145 L71 80 Z"
        fill="#0a1628" opacity="0.6"/>
  <!-- Checkmark / Alert symbol -->
  <path d="M110 130 L125 150 L150 110"
        fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Eye symbol (for scanning) -->
  <circle cx="128" cy="165" r="20" fill="none" stroke="#06b6d4" stroke-width="5"/>
  <circle cx="128" cy="165" r="8" fill="#06b6d4"/>
</svg>