version: '3.8'
services:
  backend:
    build: ./eta/backend
    container_name: eta-backend
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET_KEY=7d8ae94b2b2c156fd9bab2a56ef1a11ff6f6ad5b7917fca49bed9c428de3cf7b
      - ADMIN_EMAIL=demo@example.com
      - ADMIN_PASSWORD=ChangeMe123
    restart: unless-stopped

  frontend:
    build:
      context: ./eta/frontend
      args:
        VITE_API_URL: http://backend:8000
    container_name: eta-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
